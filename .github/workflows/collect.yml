name: collect
on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST
    - cron: "30 8 * * *"   # 14:00 IST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: collect
        run: python run.py all --days 3
      - name: process
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.process --limit 30
      - name: commit
        run: |
          git config user.name "cra-bot"
          git config user.email "bot@users.noreply.github.com"
          git add db/ data/ || true
          git diff --cached --quiet || git commit -m "collect $(date -u +%F_%H%M)"
          git push || true
