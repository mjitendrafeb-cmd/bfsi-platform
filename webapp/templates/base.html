<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}BFSI Intelligence Platform{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="topnav">
    <span class="brand">BFSI Intelligence Platform</span>
    <a href="/dashboard" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
    <a href="/entity/1" class="{{ 'active' if active == 'entity' }}">Entities</a>
    <a href="/compare" class="{{ 'active' if active == 'compare' }}">Peer Comparison</a>
    <a href="/review" class="{{ 'active' if active == 'review' }}">Review Queue</a>
    {% if active == 'entity' and entities %}
    <span class="entity-subnav">
      {% for eid, e in entities.items() %}
      <a href="/entity/{{ eid }}" class="{{ 'active' if entity and entity['id']|int == eid }}">{{ e['display_name'] }}</a>
      {% endfor %}
    </span>
    {% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
